name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize deploys on main so two quick merges can't land out of order, but
# cancel in-progress runs on PR branches when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Infra-only changes skip the app jobs by condition, not `paths`: a skipped
  # job passes a required check, but a skipped workflow leaves it pending.
  # Dependents run unless an output is exactly `false`, so a failed detection
  # still tests everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.diff.outputs.app }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] &&
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") &&
            [ -n "$files" ]; then
            grep -qv '^infra/' <<< "$files" && app=true || app=false
            grep -q '^infra/' <<< "$files" && infra=true || infra=false
          else
            app=true
            infra=true
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"

  # Spacelift plans infra/cloudflare, but it is not a required check, so this
  # catches formatting and configuration errors on the PR itself. No backend and
  # no credentials: validate needs only the providers from the lock file.
  infra:
    name: Validate infrastructure
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.infra != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: Format check
        run: tofu -chdir=infra/cloudflare fmt -check -recursive
      - name: Validate
        run: |
          tofu -chdir=infra/cloudflare init -backend=false -input=false
          tofu -chdir=infra/cloudflare validate

  test:
    name: App Test & Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-app

      - name: Prepare local app environment
        run: cp .dev.vars.example .dev.vars

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dead code check
        run: pnpm deadcode

      - name: Type check
        run: pnpm typecheck

      # The Vitest worker applies every D1 migration to a fresh database, so
      # this catches migration and query regressions before production changes.
      - name: Test
        run: pnpm test

      # The seed checks run against a migrated, default-seeded database, built
      # the way `pnpm setup` builds one, and each mutates its own copy.
      - name: Seed checks
        run: |
          pnpm db:migrate:local
          pnpm seed
          db=$(find .wrangler/state/v3/d1/miniflare-D1DatabaseObject -name '*.sqlite' ! -name 'metadata*')
          cp "$db" "$RUNNER_TEMP/social.sqlite"
          cp "$db" "$RUNNER_TEMP/trips.sqlite"
          pnpm test:seed-social "$RUNNER_TEMP/social.sqlite"
          pnpm test:seed-trips "$RUNNER_TEMP/trips.sqlite"

  # Browser checks cover rendering and native interaction. Accessibility is a
  # bounded set of composed states; stories do not each create four more tests.
  ui-tests:
    name: UI (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, rust]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.rust.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: app, shard: 1, shards: 1 }
          - { suite: gallery, shard: 1, shards: 3 }
          - { suite: gallery, shard: 2, shards: 3 }
          - { suite: gallery, shard: 3, shards: 3 }
    env:
      BETABOOK_PREBUILT: "1"
      BETABOOK_UI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app
      - name: Restore tested application
        if: matrix.suite == 'app'
        uses: actions/download-artifact@v7
        with:
          name: betabook-release
          path: .
      # Playwright pins the browser build to its own version, so the lockfile is
      # the cache key. Without this every job re-downloads Chromium.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      # The worker count is chosen against the runner's cores, so record what
      # this job actually got; a change in runner size changes that choice.
      - name: Report runner size
        run: |
          echo "cores: $(nproc)  memory: $(free -g | awk '/^Mem:/ {print $2}')GB"
          lscpu | grep 'Model name'
      - name: Prepare local app environment
        if: matrix.suite == 'app'
        run: cp .dev.vars.example .dev.vars
      - name: Build component gallery
        if: matrix.suite == 'gallery'
        run: pnpm storybook:build
      - name: Run browser tests
        run: >-
          pnpm exec playwright test --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-reference-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI reference
    needs: [changes, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every viewport and theme to pass
        env:
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: test "$APP_CHANGED" = false || test "$UI_RESULT" = success

  rust:
    name: Rust Test & Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app
        with:
          tools: node pnpm rust cargo:worker-build
      - uses: Swatinem/rust-cache@v2
      - run: mise run rust-check
      - run: pnpm api:check
      - run: pnpm build
      # Wrangler inspects the built entrypoint to infer Worker exports.
      - name: Check Cloudflare env types
        env:
          BETABOOK_PREBUILT: "1"
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen
          git diff --exit-code cloudflare-env.d.ts
      - run: pnpm test:rust-worker
        env:
          BETABOOK_PREBUILT: "1"
      - name: Package tested application
        uses: actions/upload-artifact@v7
        with:
          name: betabook-release
          path: |
            dist-spa/
            crates/betabook-worker/build/index.js
            crates/betabook-worker/build/index_bg.wasm
          if-no-files-found: error
          retention-days: 7

  advisories:
    uses: ./.github/workflows/rust-advisories.yml

  # This is the existing required check on main. A failed or cancelled
  # dependency must explicitly fail it, including when a build was skipped.
  quality:
    name: Test & Build
    needs: [changes, test, rust, advisories]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DETECTION: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.test.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ADVISORIES: ${{ needs.advisories.result }}
        run: |
          test "$DETECTION" = success
          test "$ADVISORIES" = success
          if [ "$APP" != false ]; then
            test "$APP_RESULT" = success
            test "$RUST_RESULT" = success
          fi

  deploy:
    name: Deploy
    needs: [changes, quality, ui]
    if: needs.changes.outputs.app != 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'betabook-ca/betabook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-app

      - name: Restore tested application
        uses: actions/download-artifact@v7
        with:
          name: betabook-release
          path: .
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
      - name: Deploy Rust Worker and SPA
        run: pnpm deploy
        env:
          BETABOOK_PREBUILT: "1"
