name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize deploys on main so two quick merges can't land out of order, but
# cancel in-progress runs on PR branches when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Infra-only changes skip jobs by condition, not `paths`: a skipped job passes
  # a required check, but a skipped workflow leaves it pending. Dependents run
  # unless this reports exactly `false`, so a failed detection still tests.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] &&
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") &&
            [ -n "$files" ] &&
            ! grep -qv '^infra/' <<< "$files"; then
            echo app=false >> "$GITHUB_OUTPUT"
          else
            echo app=true >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test & Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm, Node, and the dependencies, so there is no separate
      # install step. Caches the store and pnpm's minimumReleaseAge verdict.
      # Not @v2 -- that tag still resolves to v2.0.2, which has neither the
      # verdict cache nor require-lockfile, and only warns on the latter.
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dead code check
        run: pnpm deadcode

      - name: Type check
        run: pnpm typecheck

      # The Vitest worker applies every D1 migration to a fresh database, so
      # this catches migration and query regressions before production changes.
      - name: Test
        run: pnpm test

      # Split from the deploy step below: `next build` typechecks, so a broken
      # compile stops here instead of shipping.
      - name: Build
        run: pnpm exec opennextjs-cloudflare build

  # Every workflow in the organization shares 20 concurrent jobs, so each runner
  # is packed rather than adding runners. The @app tests need `next dev`, which
  # limits a runner to two Playwright workers, so they get one short job. The
  # gallery shards serve only the static build; playwright.config.ts sets their
  # workers. A gallery shard takes up to ten minutes on the slowest runner CPU.
  ui-tests:
    name: UI (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: app, shard: 1, shards: 1 }
          - { suite: gallery, shard: 1, shards: 3 }
          - { suite: gallery, shard: 2, shards: 3 }
          - { suite: gallery, shard: 3, shards: 3 }
    env:
      BETABOOK_UI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # Playwright pins the browser build to its own version, so the lockfile is
      # the cache key. Without this every job re-downloads Chromium.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      # The worker count is chosen against the runner's cores, so record what
      # this job actually got; a change in runner size changes that choice.
      - name: Report runner size
        run: |
          echo "cores: $(nproc)  memory: $(free -g | awk '/^Mem:/ {print $2}')GB"
          lscpu | grep 'Model name'
      - name: Prepare local app environment
        if: matrix.suite == 'app'
        run: cp .dev.vars.example .dev.vars
      # Every suite needs the build: design-system.spec.ts collects its tests
      # from the story index when the file loads, before any filter applies.
      - name: Build component gallery
        run: pnpm storybook:build
      - name: Run browser tests
        run: >-
          pnpm exec playwright test --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-reference-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI reference
    needs: [changes, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every viewport and theme to pass
        env:
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: test "$APP_CHANGED" = false || test "$UI_RESULT" = success

  deploy:
    name: Deploy
    needs: [test, ui]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'betabook-ca/betabook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm, Node, and the dependencies, so there is no separate
      # install step. Caches the store and pnpm's minimumReleaseAge verdict.
      # Not @v2 -- that tag still resolves to v2.0.2, which has neither the
      # verdict cache nor require-lockfile, and only warns on the latter.
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Build
        run: pnpm exec opennextjs-cloudflare build

      # Ahead of the worker deploy so new code never meets an old schema. The
      # running worker does see the new schema for the seconds in between, so
      # each migration has to stay backward-compatible.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy
        run: pnpm exec opennextjs-cloudflare deploy
