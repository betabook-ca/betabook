name: Rust advisories
on:
  workflow_call:
  schedule:
    - cron: "0 15 * * 1"
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: rust cargo-deny
      - run: cargo deny --locked check advisories
