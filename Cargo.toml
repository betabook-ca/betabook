[workspace]
members = [
  "crates/betabook-domain",
  "crates/betabook-db",
  "crates/betabook-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "json", "matched-path", "original-uri", "query"] }
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
tower-service = "0.3.3"
worker = { version = "0.9.0", features = ["axum", "d1", "http"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
