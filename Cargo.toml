[workspace]
members = [
  "crates/betabook-domain",
  "crates/betabook-db",
  "crates/betabook-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
schemars = "1.2.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["form", "json", "matched-path", "original-uri", "query"] }
base64 = "0.23.1"
bytes = "1.5"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.3"
pulldown-cmark = { version = "0.13", default-features = false }
regex-lite = "0.1.9"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11.2", default-features = false }
subtle = "2.6.1"
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tower-service = "0.3.3"
unicode-normalization = "0.1.26"
url = "2.5"
worker = { version = "0.9.0", features = ["axum", "d1", "http"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
