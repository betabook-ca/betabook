allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
minimumReleaseAge: 2880 # 2 days (in minutes)
overrides:
  # Converge only compatible ranges on the security fixes.
  "qs@": 6.16.0
  "sharp@": 0.35.4
  # Run dev, deploy and the workers tests on one workerd that matches production D1.
  # The Vitest pool (0.23.0) pins Miniflare 5.20260815 with workerd 1.20260815.1, and the
  # Vite plugin pins its own Miniflare. Older engines accept statements that production D1
  # rejects once CTE expansion passes about 100 ("nested too deep"); see #396.
  workerd: 1.20261110.1
  # The current Vitest pool pins this older Miniflare; retain its runtime and patch only Sharp.
  "miniflare@5.20260815.0-alpha>sharp": 0.35.4
  # This version loads TypeScript with bundled tsx; the unused legacy loader pulls esbuild 0.18.
  "drizzle-kit@0.31.10>@esbuild-kit/esm-loader": "-"
patchedDependencies:
  vinext@1.0.1: patches/vinext@1.0.1.patch
