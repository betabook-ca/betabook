packages:
  - test/reference

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
minimumReleaseAge: 2880 # 2 days (in minutes)
minimumReleaseAgeExclude:
  # tsrs 7.1.0-beta.tsrs4 shipped inside the two-day minimumReleaseAge window.
  - tsrs@7.1.0-beta.tsrs4
  - "@tsrs/darwin-arm64@7.1.0-beta.tsrs4"
  - "@tsrs/darwin-x64@7.1.0-beta.tsrs4"
  - "@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs4"
  - "@tsrs/linux-arm64-musl@7.1.0-beta.tsrs4"
  - "@tsrs/linux-x64-gnu@7.1.0-beta.tsrs4"
  - "@tsrs/linux-x64-musl@7.1.0-beta.tsrs4"
  - "@tsrs/win32-arm64@7.1.0-beta.tsrs4"
  - "@tsrs/win32-x64@7.1.0-beta.tsrs4"
overrides:
  # Converge only compatible ranges on the security fixes.
  "qs@": 6.16.0
  "sharp@": 0.35.4
  workerd: 1.20261110.1
  # This version loads TypeScript with bundled tsx; the unused legacy loader pulls esbuild 0.18.
  "drizzle-kit@0.31.11>@esbuild-kit/esm-loader": "-"
patchedDependencies:
  "@cloudflare/vitest-plugin@1.8.5": patches/@cloudflare__vitest-plugin@1.8.5.patch
  vinext@1.4.6: patches/vinext@1.4.6.patch
