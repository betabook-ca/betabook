[package]
name = "betabook-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
schemars = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
betabook-db = { path = "../betabook-db", default-features = false, features = ["d1"] }
betabook-domain = { path = "../betabook-domain" }
bytes.workspace = true
futures-util.workspace = true
futures-channel = "0.3"
percent-encoding = "2"
hex.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
regex-lite.workspace = true
sha2.workspace = true
time.workspace = true
tower-service.workspace = true
url.workspace = true
worker.workspace = true

[features]
api-spec = ["dep:schemars", "betabook-domain/api-spec", "betabook-db/api-spec"]

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"
required-features = ["api-spec"]
